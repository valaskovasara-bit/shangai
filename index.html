<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>SHANGHAI | Naše šipky</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f7f8fc;font-family:system-ui,-apple-system,sans-serif}main{max-width:800px;margin:auto;padding:14px 14px 45px}h1{font-size:28px;margin:8px 0}h2{font-size:18px;margin:10px 0}.muted{color:#b6c2d7;font-size:13px}.panel{background:#1b283b;border:1px solid #34445b;border-radius:16px;padding:13px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.player{border:2px solid #445;border-radius:15px;padding:12px;min-width:0}.player.active{box-shadow:0 0 0 2px #f4e49e}.player .score{font-size:36px;font-weight:800}.player .name{font-size:18px;font-weight:800}button,select,input{font:inherit;border-radius:11px;border:1px solid #61728a;min-height:44px}button{background:#33455f;color:white;padding:10px 13px;font-weight:750;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35}button.primary{background:#d3ad48;color:#141923;border:0}button.red{background:#8b2c3b}button.blue{background:#1f578b}button.selected{outline:3px solid #fff}input,select{background:#263750;color:white;padding:8px;max-width:100%}.hits{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.hits button{font-size:20px;padding:9px 0;min-height:56px}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.controls button{padding:10px 2px}.note{color:#e9d79b}.log{font-size:13px;line-height:1.6;max-height:110px;overflow:auto}.pill{background:#2b405a;border-radius:99px;padding:6px 11px}.hidden{display:none}.big{font-size:22px;font-weight:800}.danger{color:#ffadb4}@media(min-width:550px){.hits{grid-template-columns:repeat(7,minmax(0,1fr))}}</style></head><body><main><div class="muted">NAŠE ŠIPKY · samostatná hra</div><h1>SHANGHAI 🎯</h1><div class="muted">21 kol · 1–20 a Bull · okamžitá výhra Shanghai</div><div class="panel" id="setup"><h2>Nastavení před začátkem</h2><div class="row"><input id="name0" aria-label="První hráč"><input id="name1" aria-label="Druhý hráč"></div><button class="primary" id="apply" style="margin-top:9px">Použít nastavení</button></div><div class="panel"><div class="players" id="players"></div><h2 id="turn"></h2><div class="muted" id="status"></div></div><div id="game"></div><div class="panel"><div class="muted">Zadané šipky v tomto tahu</div><div id="darts" class="big" style="margin:7px 0"></div><div class="row"><button id="undo">↶ ZPĚT</button><button id="next" class="primary grow">Další hráč →</button></div></div><div class="panel"><div class="muted">Poslední události</div><div id="log" class="log"></div><button id="restart" class="red" style="margin-top:12px">Nová hra</button></div></main><script>const GAME="shanghai";const $=id=>document.getElementById(id);const clone=o=>JSON.parse(JSON.stringify(o));const key='nase-sipky-'+GAME+'-v1';let state;let history=[];function save(){try{localStorage.setItem(key,JSON.stringify({state,history:history.slice(-150)}))}catch(e){}}function load(){try{const o=JSON.parse(localStorage.getItem(key));if(o&&o.state&&Array.isArray(o.state.players)){state=o.state;history=o.history||[];return}}catch(e){}reset()}function reset(){state={players:[{name:'SÁJA',color:'#d63c45',score:0},{name:'VOKUREK',color:'#2878d0',score:0}],turn:0,darts:[],round:1,finished:false,winner:null,log:[],config:{}};history=[];initialize();save()}function commit(){history.push(clone(state));if(history.length>150)history.shift()}function undo(){if(!history.length)return;state=history.pop();save();render()}function endTurn(){if(state.finished)return;commit();finishTurn();save();render()}function nextPlayer(){state.turn=(state.turn+1)%state.players.length;if(state.turn===0)state.round++}function playerHTML(p,i){return `<div class="player ${state.turn===i&&!state.finished?'active':''}" style="border-color:${p.color}"><div class="name" style="color:${p.color}">${p.name}</div><div class="score">${p.score}</div><div class="muted">${playerMeta(i)}</div></div>`}function render(){ $('players').innerHTML=state.players.map(playerHTML).join('');$('turn').textContent=state.finished?'🏆 Vítěz: '+state.players[state.winner].name:'Na řadě: '+state.players[state.turn].name;$('darts').textContent=state.darts.length?state.darts.map(x=>x.label).join(' · '):'Zatím žádná šipka';$('undo').disabled=!history.length;$('next').disabled=state.finished;renderGame();$('log').textContent=state.log.slice(-7).reverse().join(' | ');$('setup').classList.toggle('hidden',state.round>1||state.players.some(p=>p.score!==0)||state.darts.length>0)}function addLog(t){state.log.push(t);if(state.log.length>120)state.log.shift()}function winner(i){state.finished=true;state.winner=i;addLog('🏆 Vyhrává '+state.players[i].name)}function setupPlayers(){const a=$('name0').value.trim()||'SÁJA',b=$('name1').value.trim()||'VOKUREK';state.players[0].name=a;state.players[1].name=b;setupGame();save();render()}function restart(){if(confirm('Opravdu začít úplně novou hru?')){reset();render()}}function init(){load();$('undo').onclick=undo;$('next').onclick=endTurn;$('restart').onclick=restart;$('apply').onclick=setupPlayers;$('name0').value=state.players[0].name;$('name1').value=state.players[1].name;render()}window.addEventListener('DOMContentLoaded',init);
let mult=1;function initialize(){state.extra={roundHits:[[],[]],tie:false,tieScores:[0,0]}}function setupGame(){}function target(){return state.round===21?25:state.round}function playerMeta(i){return state.extra.tie?'Rozstřel · '+state.extra.tieScores[i]:'Body v Shanghai'}function hit(n){if(state.finished||state.darts.length>=3)return;commit();const t=target();let val=0,label='MIMO',kind=0;if(n===0){}else if(t===25){val=n===50?50:n===25?25:0;label=n===50?'BULL 50':'BULL 25'}else{val=n*mult;kind=mult;label=(mult===1?'S':mult===2?'D':'T')+n}if(state.extra.tie){val=n===50?2:n===25?1:0;label=n===50?'BULL 50':n===25?'BULL 25':'MIMO'}state.darts.push({val,label,kind});mult=1;if(!state.extra.tie&&t!==25){const ks=state.darts.map(x=>x.kind);if(ks.includes(1)&&ks.includes(2)&&ks.includes(3)){state.players[state.turn].score+=state.darts.reduce((a,x)=>a+x.val,0);winner(state.turn);state.darts=[];save();render();return}}if(state.darts.length===3)finishTurn();save();render()}function finishTurn(){const p=state.turn;if(state.extra.tie){const best=state.darts.reduce((a,x)=>a+x.val,0);state.extra.tieScores[p]=best;addLog(state.players[p].name+' rozstřel: '+best);state.darts=[];nextPlayer();if(state.turn===0){const a=state.extra.tieScores;if(a[0]!==a[1])winner(a[0]>a[1]?0:1);else{state.extra.tieScores=[0,0];addLog('Shoda, rozstřel znovu')}}return}const pts=state.darts.reduce((a,x)=>a+x.val,0);state.players[p].score+=pts;addLog(state.players[p].name+' · '+(target()===25?'BULL':target())+': +'+pts);state.darts=[];nextPlayer();if(state.round>21){const a=state.players.map(p=>p.score);if(a[0]!==a[1])winner(a[0]>a[1]?0:1);else{state.extra.tie=true;state.round=21;addLog('Shoda! Rozstřel na Bull')}}}function renderGame(){let t=target();let h='<div class="panel"><h2>'+(state.extra.tie?'Rozstřel na Bull':'Kolo '+state.round+' / 21 · cíl '+(t===25?'BULL':t))+'</h2><div class="muted">3 šipky na aktuální číslo. Shanghai = S+D+T v jednom kole → okamžitá výhra.</div>';if(!state.extra.tie&&t!==25){h+='<div class="row" style="margin-top:14px">';[1,2,3].forEach(m=>h+=`<button class="${mult===m?'selected':''}" onclick="mult=${m};render()">${['','SINGLE','DOUBLE','TRIPLE'][m]}</button>`);h+='</div>'}h+='<div class="hits" style="margin-top:12px">';if(t===25||state.extra.tie){h+='<button onclick="hit(25)">BULL 25</button><button onclick="hit(50)">BULL 50</button>'}else h+=`<button onclick="hit(${t})">${['','S','D','T'][mult]}${t}</button>`;h+='<button onclick="hit(0)">MIMO</button></div></div>';$('game').innerHTML=h;$('status').textContent=state.extra.tie?'Rozstřel: každý 3 šipky na Bull':'Kolo '+state.round+' · aktuální cíl '+(t===25?'Bull':t)}</script></body></html>
